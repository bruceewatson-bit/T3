<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Brew Translate</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #1e293b;
      --card-sub: #0f172a;
      --accent: #f59e0b;
      --text: #f8fafc;
      --text-dim: #94a3b8;
      --success: #10b981;
      --error: #ef4444;
      --speaker-en: #0284c7;
      --speaker-th1: #9333ea;
      --speaker-th2: #059669;
      --bubble-en: #0f172a;
      --bubble-th1: #1e1b4b;
      --bubble-th2: #064e3b;
      --radius: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 12px; display: flex; justify-content: center; min-height: 100vh; }
    .app-container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 10px; padding-bottom: 24px; }

    /* Header */
    .header { display: flex; justify-content: space-between; align-items: center; }
    .brand { font-size: 1.35rem; font-weight: 800; color: var(--accent); display: flex; align-items: center; gap: 6px; }
    .header-actions { display: flex; gap: 8px; align-items: center; }
    .sync-badge { background: #1e293b; border: 1px solid #334155; padding: 4px 10px; border-radius: 20px; font-size: 0.72rem; display: flex; align-items: center; gap: 6px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #64748b; }
    .status-dot.active { background: var(--success); box-shadow: 0 0 8px var(--success); }
    .btn-icon { background: #1e293b; border: 1px solid #334155; color: var(--text); width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 0.9rem; }

    /* API Settings Bar */
    .api-key-bar { background: #1e293b; border: 1px dashed #475569; border-radius: 12px; padding: 10px; display: flex; gap: 8px; font-size: 0.8rem; }
    .api-key-bar input { flex: 1; background: transparent; border: none; color: white; outline: none; font-size: 0.8rem; }
    .api-key-bar button { background: var(--accent); border: none; border-radius: 6px; padding: 4px 8px; font-weight: 600; cursor: pointer; color: #0b0f19; }

    /* Language Direction Bar */
    .lang-mode-bar { display: flex; gap: 6px; background: #0f172a; padding: 3px; border-radius: 12px; border: 1px solid #334155; }
    .btn-lang {
      flex: 1; padding: 8px 4px; background: transparent; border: none; color: var(--text-dim);
      font-size: 0.75rem; font-weight: 700; border-radius: 8px; cursor: pointer; text-align: center;
      transition: all 0.2s;
    }
    .btn-lang.active { background: var(--accent); color: #0b0f19; }

    /* Output Mode Selector */
    .output-mode-container { display: flex; background: #0f172a; border-radius: 10px; border: 1px solid #334155; padding: 2px; }
    .mode-btn {
      flex: 1; padding: 6px 4px; font-size: 0.72rem; font-weight: 700; color: var(--text-dim);
      background: transparent; border: none; border-radius: 8px; cursor: pointer; text-align: center;
      transition: all 0.2s;
    }
    .mode-btn.selected { background: var(--accent); color: #0b0f19; }

    /* Room Bar */
    .room-bar { display: flex; gap: 8px; background: var(--card-bg); padding: 8px 12px; border-radius: 12px; align-items: center; border: 1px solid #334155; }
    .room-bar input { flex: 1; background: transparent; border: none; color: white; font-size: 0.85rem; outline: none; }
    .room-bar button { padding: 5px 10px; background: #334155; border: none; color: white; border-radius: 8px; font-size: 0.75rem; font-weight: 600; cursor: pointer; }

    /* Main Card */
    .card { background: var(--card-bg); border: 1px solid #334155; border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 10px; transition: border 0.3s; }
    .card.speaker-en { border-color: var(--speaker-en); }
    .card.speaker-th1 { border-color: var(--speaker-th1); }
    .card.speaker-th2 { border-color: var(--speaker-th2); }

    .input-area { width: 100%; min-height: 48px; background: transparent; border: none; color: var(--text); font-size: 1.05rem; resize: none; outline: none; line-height: 1.35; }
    .input-area::placeholder { color: #64748b; }

    /* Result Display */
    .result-section { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid #334155; padding-top: 10px; }
    .speaker-tag { font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; display: flex; align-items: center; gap: 6px; }
    .speaker-tag.en { color: #38bdf8; }
    .speaker-tag.th1 { color: #c084fc; }
    .speaker-tag.th2 { color: #34d399; }

    .target-text { font-size: 1.45rem; font-weight: 700; line-height: 1.3; }
    .target-text.en-out { color: #c084fc; }
    .target-text.en-out2 { color: #34d399; }
    .target-text.th-out { color: #38bdf8; }

    .phonetic-box { background: var(--card-sub); padding: 8px 10px; border-radius: 8px; border-left: 3px solid var(--accent); }
    .phonetic-label { font-size: 0.65rem; text-transform: uppercase; color: var(--accent); font-weight: 800; }
    .phonetic-text { font-size: 0.95rem; font-weight: 600; color: #e2e8f0; margin-top: 2px; }
    .thai-phonetic-text { font-size: 0.9rem; color: #a5f3fc; margin-top: 2px; }
    .tone-tip { font-size: 0.75rem; color: #a3e635; font-style: italic; }
    .loading-pulse { animation: pulse 0.8s infinite alternate; color: var(--text-dim); }

    /* Split 1/3 Listen & 2/3 Speak Mic Bar */
    .mic-bar { display: flex; gap: 8px; align-items: stretch; }
    .btn-listen {
      flex: 1; padding: 14px 6px; background: #1e293b; border: 1px solid #334155;
      border-radius: var(--radius); color: var(--text-dim); font-size: 0.82rem; font-weight: 800;
      cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    }
    .btn-listen.active { background: rgba(16, 185, 129, 0.2); border-color: var(--success); color: var(--success); }

    .btn-speak {
      flex: 2; padding: 14px; background: var(--accent); border: none; border-radius: var(--radius);
      color: #0b0f19; font-size: 1.05rem; font-weight: 800; cursor: pointer; display: flex;
      align-items: center; justify-content: center; gap: 8px;
    }
    .btn-speak.listening { background: var(--error); color: white; animation: pulse 1.2s infinite; }

    /* Conversation History Stream */
    .history-header { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; padding: 0 4px; }
    .history-title { font-size: 0.8rem; text-transform: uppercase; font-weight: 800; color: var(--text-dim); letter-spacing: 0.5px; }
    .btn-clear { background: transparent; border: none; color: #ef4444; font-size: 0.75rem; cursor: pointer; font-weight: 600; }
    
    .history-list { display: flex; flex-direction: column; gap: 8px; max-height: 280px; overflow-y: auto; padding-right: 2px; }
    .history-bubble {
      padding: 10px 12px; border-radius: 12px; display: flex; flex-direction: column; gap: 4px;
      font-size: 0.85rem; border: 1px solid #334155; position: relative;
    }
    .history-bubble.speaker-en { background: var(--bubble-en); border-left: 4px solid var(--speaker-en); }
    .history-bubble.speaker-th1 { background: var(--bubble-th1); border-left: 4px solid var(--speaker-th1); }
    .history-bubble.speaker-th2 { background: var(--bubble-th2); border-left: 4px solid var(--speaker-th2); }
    
    .bubble-meta { display: flex; justify-content: space-between; font-size: 0.68rem; font-weight: 800; }
    .bubble-meta.en { color: #38bdf8; }
    .bubble-meta.th1 { color: #c084fc; }
    .bubble-meta.th2 { color: #34d399; }
    
    .bubble-orig { color: #cbd5e1; font-style: italic; }
    .bubble-trans { font-size: 1.05rem; font-weight: 700; color: #f8fafc; margin-top: 2px; }
    .bubble-phonetic { font-size: 0.8rem; color: #a5f3fc; }

    @keyframes pulse { 0% { opacity: 1; } 100% { opacity: 0.5; } }
  </style>
</head>
<body>

<div class="app-container">
  <div class="header">
    <div class="brand">⚡ Brew Translate</div>
    <div class="header-actions">
      <div class="sync-badge">
        <div id="syncDot" class="status-dot"></div>
        <span id="syncText">Solo</span>
      </div>
      <button class="btn-icon" onclick="toggleKeySettings()">🔑</button>
    </div>
  </div>

  <div id="apiKeySection" class="api-key-bar" style="display: none;">
    <input type="password" id="geminiApiKey" placeholder="Paste Gemini API Key here..." />
    <button onclick="saveApiKey()">Save</button>
  </div>

  <div class="lang-mode-bar">
    <button id="langBtnEn" class="btn-lang active" onclick="setLanguageMode('en-to-th')">⇄ EN ➔ TH</button>
    <button id="langBtnTh" class="btn-lang" onclick="setLanguageMode('th-to-en')">⇄ TH ➔ EN</button>
    <button id="langBtnAuto" class="btn-lang" onclick="setLanguageMode('auto')">✨ Auto Detect</button>
  </div>

  <div class="output-mode-container" style="margin-top: 4px;">
    <button id="modeBoth" class="mode-btn selected" onclick="setOutputMode('both')">🔊 + 💬 Both</button>
    <button id="modeVoice" class="mode-btn" onclick="setOutputMode('voice')">🔊 Voice Only</button>
    <button id="modeText" class="mode-btn" onclick="setOutputMode('text')">💬 Text Only</button>
  </div>

  <div class="room-bar">
    <span style="font-size:0.75rem; color:var(--text-dim);">Room:</span>
    <input type="text" id="roomIdInput" placeholder="e.g. BREW88" />
    <button onclick="connectToPartner()">Pair</button>
  </div>

  <div id="mainCard" class="card">
    <textarea id="inputText" class="input-area" placeholder="Speak or type English..." onkeydown="handleEnter(event)"></textarea>
    
    <div id="resultCard" class="result-section" style="display: none;">
      <div id="speakerBadge" class="speaker-tag"></div>
      <div id="translatedText" class="target-text"></div>

      <div id="enPhoneticBox" class="phonetic-box">
        <div class="phonetic-label">English Speaker Guide</div>
        <div id="enSoundsLike" class="phonetic-text"></div>
      </div>

      <div id="thPhoneticBox" class="phonetic-box">
        <div class="phonetic-label">คำอ่านสำหรับคนไทย</div>
        <div id="thSoundsLike" class="thai-phonetic-text"></div>
      </div>

      <div id="toneTip" class="tone-tip"></div>
    </div>
  </div>

  <div class="mic-bar">
    <button id="listenToggleBtn" class="btn-listen" onclick="toggleContinuousListen()">
      <span>🎧 Auto-Listen</span>
      <span id="listenBadgeStatus" style="font-size:0.65rem; color:#94a3b8;">OFF</span>
    </button>
    <button id="speakBtn" class="btn-speak" onclick="triggerManualSpeak()">
      🎙️ Tap to Speak
    </button>
  </div>

  <div class="history-header">
    <span class="history-title">Conversation Stream</span>
    <button class="btn-clear" onclick="clearHistory()">Clear</button>
  </div>
  <div id="historyList" class="history-list"></div>
</div>

<script>
  // --- STATE ---
  let langMode = 'en-to-th';
  let isAutoListenEngaged = false;
  let isHardwareRunning = false;
  let outputMode = 'both';
  let peer = null;
  let conn = null;
  let recognition = null;
  let geminiKey = localStorage.getItem('BREW_GEMINI_KEY') || '';
  let conversationHistory = JSON.parse(localStorage.getItem('BREW_HISTORY') || '[]');
  
  let lastThaiSpeaker = 'speaker-th2';
  let lastSpeechTimestamp = 0;

  // Initialize UI
  if (!geminiKey) {
    document.getElementById('apiKeySection').style.display = 'flex';
  } else {
    document.getElementById('geminiApiKey').value = geminiKey;
  }
  renderHistory();

  function toggleKeySettings() {
    const el = document.getElementById('apiKeySection');
    el.style.display = el.style.display === 'none' ? 'flex' : 'none';
  }

  function saveApiKey() {
    const key = document.getElementById('geminiApiKey').value.trim();
    if (key) {
      geminiKey = key;
      localStorage.setItem('BREW_GEMINI_KEY', key);
      document.getElementById('apiKeySection').style.display = 'none';
      alert('API Key Saved!');
    }
  }

  function setLanguageMode(mode) {
    langMode = mode;
    document.getElementById('langBtnEn').className = 'btn-lang ' + (mode === 'en-to-th' ? 'active' : '');
    document.getElementById('langBtnTh').className = 'btn-lang ' + (mode === 'th-to-en' ? 'active' : '');
    document.getElementById('langBtnAuto').className = 'btn-lang ' + (mode === 'auto' ? 'active' : '');

    const inputArea = document.getElementById('inputText');
    if (mode === 'en-to-th') inputArea.placeholder = "Speak or type English...";
    else if (mode === 'th-to-en') inputArea.placeholder = "พูดภาษาไทย หรือพิมพ์ที่นี่...";
    else inputArea.placeholder = "Auto-detecting conversation...";
  }

  function getSelectedRecLang() {
    if (langMode === 'en-to-th') return 'en-US';
    if (langMode === 'th-to-en') return 'th-TH';
    return 'th-TH'; // Auto detects best on TH baseline
  }

  function setOutputMode(mode) {
    outputMode = mode;
    document.getElementById('modeBoth').className = 'mode-btn ' + (mode === 'both' ? 'selected' : '');
    document.getElementById('modeVoice').className = 'mode-btn ' + (mode === 'voice' ? 'selected' : '');
    document.getElementById('modeText').className = 'mode-btn ' + (mode === 'text' ? 'selected' : '');
  }

  // --- SAFE SPEECH RECOGNITION (NATIVE ONLY) ---
  function initSpeechEngine() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      alert("Speech recognition is not supported in this browser. Please use Chrome.");
      return null;
    }

    const rec = new SpeechRecognition();
    rec.continuous = true;
    rec.interimResults = false;

    rec.onstart = () => {
      isHardwareRunning = true;
      if (!isAutoListenEngaged) {
        const speakBtn = document.getElementById('speakBtn');
        speakBtn.classList.add('listening');
        speakBtn.innerText = "🎙️ Listening...";
      }
    };

    rec.onresult = (event) => {
      const results = event.results;
      const lastTranscript = results[results.length - 1][0].transcript.trim();
      if (lastTranscript) {
        document.getElementById('inputText').value = lastTranscript;
        executeTranslation(lastTranscript);
      }
    };

    rec.onerror = (e) => {
      // Do nothing on silence error to prevent freezing
    };

    rec.onend = () => {
      isHardwareRunning = false;
      const speakBtn = document.getElementById('speakBtn');
      speakBtn.classList.remove('listening');
      speakBtn.innerText = "🎙️ Tap to Speak";

      // If Auto-Listen is ON, safely attempt to restart
      if (isAutoListenEngaged) {
        setTimeout(() => {
          if (isAutoListenEngaged && !isHardwareRunning) {
            try { rec.start(); } catch(err){}
          }
        }, 300);
      }
    };

    return rec;
  }

  function toggleContinuousListen() {
    isAutoListenEngaged = !isAutoListenEngaged;
    const listenBtn = document.getElementById('listenToggleBtn');
    const badge = document.getElementById('listenBadgeStatus');

    if (isAutoListenEngaged) {
      listenBtn.classList.add('active');
      badge.innerText = "ACTIVE";
      badge.style.color = "var(--success)";
      if (!recognition) recognition = initSpeechEngine();
      recognition.lang = getSelectedRecLang();
      if (!isHardwareRunning) {
        try { recognition.start(); } catch(e){}
      }
    } else {
      listenBtn.classList.remove('active');
      badge.innerText = "OFF";
      badge.style.color = "#94a3b8";
      if (recognition && isHardwareRunning) {
        recognition.stop();
      }
    }
  }

  function triggerManualSpeak() {
    if (isAutoListenEngaged) return; // Ignore if auto is running

    if (!recognition) recognition = initSpeechEngine();
    recognition.lang = getSelectedRecLang();

    if (isHardwareRunning) {
      recognition.stop();
    } else {
      try { recognition.start(); } catch(e){}
    }
  }

  function handleEnter(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      executeTranslation(e.target.value);
    }
  }

  // --- ROCK SOLID TRANSLATION CORE ---
  async function executeTranslation(text) {
    const cleanText = text.trim();
    if (!cleanText) return;

    if (!geminiKey) {
      alert('Please enter your Gemini API Key using the 🔑 button.');
      return;
    }

    const now = Date.now();
    const timeDelta = now - lastSpeechTimestamp;
    lastSpeechTimestamp = now;

    const hasThaiScript = /[\u0E00-\u0E7F]/.test(cleanText);
    let speakerRole = 'speaker-en';
    let speakerLabel = '🧔 English Speaker';
    let direction = 'English to Spoken Thai';
    let targetLangCode = 'th-TH';

    if (langMode === 'th-to-en' || (langMode === 'auto' && hasThaiScript)) {
      if (timeDelta > 2000) {
        lastThaiSpeaker = (lastThaiSpeaker === 'speaker-th1') ? 'speaker-th2' : 'speaker-th1';
      }
      speakerRole = lastThaiSpeaker;
      speakerLabel = (speakerRole === 'speaker-th1') ? '👩 Thai Speaker 1' : '👱 Thai Speaker 2';
      direction = 'Thai to Conversational English';
      targetLangCode = 'en-US';
    }

    // UPDATE UI IMMEDIATELY
    document.getElementById('mainCard').className = `card ${speakerRole}`;
    document.getElementById('resultCard').style.display = 'flex';
    document.getElementById('speakerBadge').innerHTML = `<span class="speaker-tag ${speakerRole.replace('speaker-', '')}">${speakerLabel}</span>`;
    
    const targetEl = document.getElementById('translatedText');
    targetEl.className = `target-text ${speakerRole === 'speaker-th1' ? 'en-out' : speakerRole === 'speaker-th2' ? 'en-out2' : 'th-out'}`;
    targetEl.innerHTML = `<span class="loading-pulse">Translating...</span>`;

    const systemPrompt = `You are "Brew Translate", an ultra-natural conversational Thai-English translator.
Translate direction: ${direction}.
Translate with authentic spoken Thai particles (นะ, ครับ/ค่ะ, อ่ะ, ป่ะ, เลย).

Output valid JSON ONLY:
{
  "translatedText": "Natural spoken translation",
  "enSoundsLike": "Intuitive phonetic guide with CAPITALIZED stressed syllables",
  "thSoundsLike": "คำอ่านภาษาไทย for Thai native pronunciation",
  "toneTip": "1 brief sentence on tone or nuance"
}`;

    const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${geminiKey}`;

    try {
      const response = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ role: 'user', parts: [{ text: cleanText }] }],
          systemInstruction: { parts: [{ text: systemPrompt }] },
          generationConfig: { responseMimeType: "application/json", temperature: 0.15 }
        })
      });

      const data = await response.json();
      if (data.error) throw new Error(data.error.message || 'API Error');

      let rawText = data.candidates[0].content.parts[0].text;
      rawText = rawText.replace(/```json/gi, '').replace(/```/g, '').trim();
      const result = JSON.parse(rawText);

      // GUARANTEE DOM UPDATE
      targetEl.innerText = result.translatedText;
      document.getElementById('enSoundsLike').innerText = result.enSoundsLike;
      document.getElementById('thSoundsLike').innerText = result.thSoundsLike;
      document.getElementById('toneTip').innerText = result.toneTip;

      // ATTEMPT AUDIO/SYNC IN ISOLATION SO IT NEVER FREEZES THE UI
      try {
        if (outputMode === 'both' || outputMode === 'voice') {
          speakVoiceActor(result.translatedText, targetLangCode, speakerRole);
        }
      } catch (audioErr) { console.warn("Audio skipped:", audioErr); }

      try {
        logToHistory({
          speakerRole: speakerRole,
          speakerLabel: speakerLabel,
          original: cleanText,
          translation: result.translatedText,
          phonetic: speakerRole === 'speaker-en' ? result.enSoundsLike : result.thSoundsLike,
          lang: targetLangCode,
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        });
      } catch (histErr) { console.warn("History skipped:", histErr); }

      try {
        if (conn && conn.open) {
          conn.send({ original: cleanText, data: result, speakerRole, speakerLabel, targetLangCode });
        }
      } catch (peerErr) { console.warn("Peer Sync skipped:", peerErr); }

    } catch (err) {
      console.error(err);
      targetEl.innerText = `Error: ${err.message || 'Failed'}`;
    }
  }

  // --- AUDIO PLAYBACK PROFILES ---
  function speakVoiceActor(text, langCode, speakerRole) {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = langCode;
    utterance.rate = 0.95;
    if (speakerRole === 'speaker-th1') utterance.pitch = 1.15;
    else if (speakerRole === 'speaker-th2') utterance.pitch = 0.90;
    else utterance.pitch = 1.0;
    window.speechSynthesis.speak(utterance);
  }

  // --- LOGGING ---
  function logToHistory(entry) {
    conversationHistory.unshift(entry);
    if (conversationHistory.length > 50) conversationHistory.pop();
    localStorage.setItem('BREW_HISTORY', JSON.stringify(conversationHistory));
    renderHistory();
  }

  function renderHistory() {
    const list = document.getElementById('historyList');
    list.innerHTML = '';
    conversationHistory.forEach((item) => {
      const tagClass = item.speakerRole.replace('speaker-', '');
      const bubble = document.createElement('div');
      bubble.className = `history-bubble ${item.speakerRole}`;
      bubble.innerHTML = `
        <div class="bubble-meta ${tagClass}">
          <span>${item.speakerLabel}</span>
          <span>${item.time}</span>
        </div>
        <div class="bubble-orig">"${item.original}"</div>
        <div class="bubble-trans">${item.translation}</div>
        <div class="bubble-phonetic">🗣️ ${item.phonetic}</div>
      `;
      list.appendChild(bubble);
    });
  }

  function clearHistory() {
    conversationHistory = [];
    localStorage.removeItem('BREW_HISTORY');
    renderHistory();
  }

  // --- WEBRTC ---
  function connectToPartner() {
    const roomId = document.getElementById('roomIdInput').value.trim().toLowerCase();
    if (!roomId) return;
    peer = new Peer(roomId + '-host');
    peer.on('open', () => updateSyncStatus(true, `Room: ${roomId.toUpperCase()}`));
    peer.on('error', () => {
      peer = new Peer();
      conn = peer.connect(roomId + '-host');
      setupConnection();
    });
    peer.on('connection', (c) => {
      conn = c;
      setupConnection();
    });
  }

  function setupConnection() {
    updateSyncStatus(true, "Paired!");
    conn.on('data', (payload) => {
      // Process received data
      document.getElementById('mainCard').className = `card ${payload.speakerRole}`;
      document.getElementById('resultCard').style.display = 'flex';
      document.getElementById('speakerBadge').innerHTML = `<span class="speaker-tag ${payload.speakerRole.replace('speaker-', '')}">${payload.speakerLabel}</span>`;
      const targetEl = document.getElementById('translatedText');
      targetEl.className = `target-text ${payload.speakerRole === 'speaker-th1' ? 'en-out' : payload.speakerRole === 'speaker-th2' ? 'en-out2' : 'th-out'}`;
      targetEl.innerText = payload.data.translatedText;
      document.getElementById('enSoundsLike').innerText = payload.data.enSoundsLike;
      document.getElementById('thSoundsLike').innerText = payload.data.thSoundsLike;
      document.getElementById('toneTip').innerText = payload.data.toneTip;
      
      if (outputMode === 'both' || outputMode === 'voice') {
        speakVoiceActor(payload.data.translatedText, payload.targetLangCode, payload.speakerRole);
      }
    });
  }

  function updateSyncStatus(connected, text) {
    document.getElementById('syncDot').className = 'status-dot ' + (connected ? 'active' : '');
    document.getElementById('syncText').innerText = text;
  }
</script>
</body>
</html>
