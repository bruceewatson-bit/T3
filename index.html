<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Brew Translate</title>
  <!-- Walkie-Talkie Network -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <!-- QR Code Generator -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #1e293b;
      --card-sub: #0f172a;
      --accent: #f59e0b;
      --text: #f8fafc;
      --text-dim: #94a3b8;
      --success: #10b981;
      --error: #ef4444;
      --eavesdrop: #ec4899;
      --speaker-en: #0284c7;
      --speaker-th1: #9333ea;
      --speaker-th2: #059669;
      --radius: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 12px; display: flex; justify-content: center; min-height: 100vh; }
    .app-container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 10px; padding-bottom: 24px; }

    /* Header */
    .header { display: flex; justify-content: space-between; align-items: center; }
    .brand { font-size: 1.35rem; font-weight: 800; color: var(--accent); display: flex; align-items: center; gap: 6px; }
    .header-actions { display: flex; gap: 8px; align-items: center; }
    .sync-badge { background: #1e293b; border: 1px solid #334155; padding: 4px 10px; border-radius: 20px; font-size: 0.72rem; display: flex; align-items: center; gap: 6px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #64748b; }
    .status-dot.active { background: var(--success); box-shadow: 0 0 8px var(--success); }
    .btn-icon { background: #1e293b; border: 1px solid #334155; color: var(--text); width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 0.9rem; }

    /* API Settings Bar */
    .api-key-bar { background: #1e293b; border: 1px dashed #475569; border-radius: 12px; padding: 10px; display: flex; gap: 8px; font-size: 0.8rem; }
    .api-key-bar input { flex: 1; background: transparent; border: none; color: white; outline: none; font-size: 0.8rem; }
    .api-key-bar button { background: var(--accent); border: none; border-radius: 6px; padding: 4px 8px; font-weight: 600; cursor: pointer; color: #0b0f19; }

    /* Top Controls */
    .lang-mode-bar { display: flex; gap: 6px; background: #0f172a; padding: 3px; border-radius: 12px; border: 1px solid #334155; }
    .btn-lang { flex: 1; padding: 8px 4px; background: transparent; border: none; color: var(--text-dim); font-size: 0.75rem; font-weight: 700; border-radius: 8px; cursor: pointer; text-align: center; transition: all 0.2s; }
    .btn-lang.active { background: var(--accent); color: #0b0f19; }

    /* Room Bar */
    .room-bar { display: flex; gap: 6px; background: var(--card-bg); padding: 8px; border-radius: 12px; align-items: center; border: 1px solid #334155; }
    .room-bar input { flex: 1; background: transparent; border: none; color: white; font-size: 0.85rem; outline: none; text-transform: uppercase; font-weight: 700; }
    .room-bar button { padding: 8px 12px; border: none; border-radius: 8px; font-size: 0.75rem; font-weight: 700; cursor: pointer; transition: all 0.2s; }
    .btn-pair { background: #334155; color: white; }
    .btn-qr { background: var(--accent); color: #0b0f19; }

    /* Main Card */
    .card { background: var(--card-bg); border: 1px solid #334155; border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 10px; transition: border 0.3s; }
    .card.speaker-en { border-color: var(--speaker-en); }
    .card.speaker-th1 { border-color: var(--speaker-th1); }
    .card.speaker-th2 { border-color: var(--speaker-th2); }
    .card.eavesdrop-mode { border-color: var(--eavesdrop); box-shadow: 0 0 15px rgba(236, 72, 153, 0.2); }

    .input-area { width: 100%; min-height: 48px; background: transparent; border: none; color: var(--text); font-size: 1.05rem; resize: none; outline: none; line-height: 1.35; }
    .input-area::placeholder { color: #64748b; }

    /* Result Display */
    .result-section { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid #334155; padding-top: 10px; }
    .speaker-tag { font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; display: flex; align-items: center; gap: 6px; }
    .speaker-tag.en { color: #38bdf8; }
    .speaker-tag.th1 { color: #c084fc; }
    .speaker-tag.th2 { color: #34d399; }
    .speaker-tag.eavesdrop { color: var(--eavesdrop); }

    .target-text { font-size: 1.45rem; font-weight: 700; line-height: 1.3; }
    .target-text.en-out { color: #c084fc; }
    .target-text.en-out2 { color: #34d399; }
    .target-text.th-out { color: #38bdf8; }
    .target-text.eavesdrop-out { color: #fdf2f8; font-size: 1.15rem; font-weight: 500; }
    
    .phonetic-box { background: var(--card-sub); padding: 8px 10px; border-radius: 8px; border-left: 3px solid var(--accent); }
    .phonetic-label { font-size: 0.65rem; text-transform: uppercase; color: var(--accent); font-weight: 800; }
    .phonetic-text { font-size: 0.95rem; font-weight: 600; color: #e2e8f0; margin-top: 2px; }
    .loading-pulse { animation: pulse 0.8s infinite alternate; color: var(--text-dim); }

    /* Mic Bar */
    .mic-bar { display: flex; gap: 6px; align-items: stretch; margin-top: 4px; }
    .btn-mic-action {
      flex: 1; padding: 12px 4px; background: #1e293b; border: 1px solid #334155;
      border-radius: 12px; color: var(--text-dim); font-size: 0.75rem; font-weight: 800;
      cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
      transition: all 0.2s;
    }
    .btn-mic-action.active-green { background: rgba(16, 185, 129, 0.2); border-color: var(--success); color: var(--success); }
    .btn-mic-action.active-blue { background: var(--speaker-en); color: white; border-color: #0284c7; }
    .btn-mic-action.active-pink { background: var(--error); color: white; border-color: var(--error); animation: pulse 1.5s infinite; }

    /* History */
    .history-header { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; padding: 0 4px; }
    .history-title { font-size: 0.8rem; text-transform: uppercase; font-weight: 800; color: var(--text-dim); }
    .btn-clear { background: transparent; border: none; color: #ef4444; font-size: 0.75rem; cursor: pointer; font-weight: 600; }
    .history-list { display: flex; flex-direction: column; gap: 8px; max-height: 280px; overflow-y: auto; padding-right: 2px; }
    .history-bubble { padding: 10px 12px; border-radius: 12px; display: flex; flex-direction: column; gap: 4px; font-size: 0.85rem; border: 1px solid #334155; }
    
    /* QR Modal Overlay */
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(11, 15, 25, 0.9); backdrop-filter: blur(5px);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000; padding: 20px;
    }
    .modal-content {
      background: var(--card-bg); border: 1px solid #334155;
      border-radius: 20px; padding: 24px; width: 100%; max-width: 340px;
      text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .qr-box { background: white; padding: 20px; border-radius: 16px; display: inline-block; margin: 10px 0; }

    @keyframes pulse { 0% { opacity: 1; } 100% { opacity: 0.6; } }
  </style>
</head>
<body>

<div class="app-container">
  <div class="header">
    <div class="brand">⚡ Brew Translate</div>
    <div class="header-actions">
      <div class="sync-badge">
        <div id="syncDot" class="status-dot"></div>
        <span id="syncText">Solo</span>
      </div>
      <button class="btn-icon" onclick="toggleKeySettings()">🔑</button>
    </div>
  </div>

  <div id="apiKeySection" class="api-key-bar" style="display: none;">
    <input type="password" id="geminiApiKey" placeholder="Paste Gemini API Key here..." />
    <button onclick="saveApiKey()">Save</button>
  </div>

  <div class="lang-mode-bar">
    <button id="langBtnEn" class="btn-lang active" onclick="setLanguageMode('en-to-th')">⇄ EN ➔ TH</button>
    <button id="langBtnTh" class="btn-lang" onclick="setLanguageMode('th-to-en')">⇄ TH ➔ EN</button>
    <button id="langBtnAuto" class="btn-lang" onclick="setLanguageMode('auto')">✨ Auto Detect</button>
  </div>

  <!-- Room Pairing & QR Bar -->
  <div class="room-bar">
    <span style="font-size:0.75rem; color:var(--text-dim);">Room:</span>
    <input type="text" id="roomIdInput" value="BREW555" />
    <button class="btn-pair" onclick="connectToPartner()">Pair</button>
    <button class="btn-qr" onclick="showQrModal()">📷 QR</button>
  </div>

  <!-- Main Output Card -->
  <div id="mainCard" class="card">
    <textarea id="inputText" class="input-area" placeholder="Speak, type, or use Eavesdrop mode..." onkeydown="handleEnter(event)"></textarea>
    
    <div id="resultCard" class="result-section" style="display: none;">
      <div id="speakerBadge" class="speaker-tag"></div>
      <div id="translatedText" class="target-text"></div>

      <div id="phoneticContainer" style="display:none; flex-direction:column; gap:8px;">
        <div class="phonetic-box">
          <div class="phonetic-label">English Speaker Guide</div>
          <div id="enSoundsLike" class="phonetic-text"></div>
        </div>
        <div class="phonetic-box">
          <div class="phonetic-label">คำอ่านสำหรับคนไทย</div>
          <div id="thSoundsLike" class="phonetic-text" style="color:#a5f3fc;"></div>
        </div>
        <div id="toneTip" style="font-size: 0.75rem; color: #a3e635; font-style: italic;"></div>
      </div>
    </div>
  </div>

  <!-- Core Control Panel -->
  <div class="mic-bar">
    <button id="listenToggleBtn" class="btn-mic-action" onclick="toggleContinuousListen()">
      <span style="font-size:1.1rem;">🎧</span>
      <span>Auto-Listen</span>
    </button>
    <button id="speakBtn" class="btn-mic-action" onclick="triggerManualSpeak()">
      <span style="font-size:1.1rem;">🎙️</span>
      <span>Tap to Speak</span>
    </button>
    <button id="eavesdropBtn" class="btn-mic-action" onclick="toggleEavesdrop()">
      <span style="font-size:1.1rem;">🕵️</span>
      <span id="eavesdropLabel">Record Room</span>
    </button>
  </div>

  <div class="history-header">
    <span class="history-title">Conversation Stream</span>
    <button class="btn-clear" onclick="clearHistory()">Clear</button>
  </div>
  <div id="historyList" class="history-list"></div>
</div>

<!-- QR Code Modal (Hidden by Default) -->
<div id="qrModal" class="modal-overlay" style="display:none;" onclick="closeQrModal(event)">
  <div class="modal-content" onclick="event.stopPropagation()">
    <div class="modal-header">
      <span style="font-weight:800; color:var(--accent); font-size:1.1rem;">📱 Instant 555 Pair</span>
      <button class="btn-icon" style="background:transparent; border:none;" onclick="closeQrModal()">✕</button>
    </div>
    <p style="font-size:0.85rem; color:var(--text-dim); margin-bottom:12px;">Have them scan this with their camera to instantly join room <b style="color:var(--text);" id="modalRoomCode">BREW555</b>.</p>
    
    <div class="qr-box" id="qrcode"></div>
    
    <p style="font-size:0.8rem; color:var(--success); font-weight:700; margin-top:10px;">โชคดี (Good Luck!)</p>
  </div>
</div>

<script>
  // --- URL PARAM AUTO-JOIN & INITIALIZATION ---
  window.addEventListener('load', () => {
    const urlParams = new URLSearchParams(window.location.search);
    const roomParam = urlParams.get('room');
    if (roomParam) {
      document.getElementById('roomIdInput').value = roomParam.toUpperCase();
      connectToPartner();
    }
  });

  // --- GLOBALS & CACHE ---
  const RAM_CACHE = new Map();
  let langMode = 'en-to-th';
  let isAutoListenEngaged = false;
  let isHardwareRunning = false;
  let recognition = null;
  let geminiKey = localStorage.getItem('BREW_GEMINI_KEY') || '';
  
  let lastThaiSpeaker = 'speaker-th2';
  let lastSpeechTimestamp = 0;

  // Eavesdrop Globals
  let mediaRecorder = null;
  let audioChunks = [];
  let isEavesdropping = false;

  // Walkie-Talkie Globals
  let peer = null;
  let conn = null;

  if (!geminiKey) document.getElementById('apiKeySection').style.display = 'flex';
  else document.getElementById('geminiApiKey').value = geminiKey;

  function toggleKeySettings() {
    const el = document.getElementById('apiKeySection');
    el.style.display = el.style.display === 'none' ? 'flex' : 'none';
  }

  function saveApiKey() {
    const key = document.getElementById('geminiApiKey').value.trim();
    if (key) {
      geminiKey = key;
      localStorage.setItem('BREW_GEMINI_KEY', key);
      document.getElementById('apiKeySection').style.display = 'none';
      alert('API Key Saved!');
    }
  }

  function setLanguageMode(mode) {
    langMode = mode;
    document.getElementById('langBtnEn').className = 'btn-lang ' + (mode === 'en-to-th' ? 'active' : '');
    document.getElementById('langBtnTh').className = 'btn-lang ' + (mode === 'th-to-en' ? 'active' : '');
    document.getElementById('langBtnAuto').className = 'btn-lang ' + (mode === 'auto' ? 'active' : '');
  }

  // ==========================================
  // MODULE 1: QR CODE GENERATOR
  // ==========================================
  let qrInstance = null;
  function showQrModal() {
    const roomInput = document.getElementById('roomIdInput');
    let roomId = roomInput.value.trim().toUpperCase();
    if (!roomId) {
      roomId = 'BREW555';
      roomInput.value = roomId;
    }
    
    document.getElementById('modalRoomCode').innerText = roomId;
    
    // Generate full URL with ?room= parameter
    const baseUrl = window.location.origin + window.location.pathname;
    const joinUrl = `${baseUrl}?room=${encodeURIComponent(roomId)}`;
    
    const qrContainer = document.getElementById('qrcode');
    qrContainer.innerHTML = '';
    
    qrInstance = new QRCode(qrContainer, {
      text: joinUrl,
      width: 220,
      height: 220,
      colorDark : "#0b0f19",
      colorLight : "#ffffff",
      correctLevel : QRCode.CorrectLevel.M
    });
    
    document.getElementById('qrModal').style.display = 'flex';
  }

  function closeQrModal(e) {
    document.getElementById('qrModal').style.display = 'none';
  }

  // ==========================================
  // MODULE 2: WEBRTC ROOM PAIRING
  // ==========================================
  function connectToPartner() {
    const roomId = document.getElementById('roomIdInput').value.trim().toUpperCase();
    if (!roomId) return;
    updateSyncStatus(true, `Linking...`);
    peer = new Peer(roomId + '-host');
    peer.on('open', () => updateSyncStatus(true, `Room: ${roomId}`));
    peer.on('error', () => {
      peer = new Peer();
      conn = peer.connect(roomId + '-host');
      setupConnection();
    });
    peer.on('connection', (c) => {
      conn = c;
      setupConnection();
    });
  }

  function setupConnection() {
    updateSyncStatus(true, "Paired!");
    conn.on('data', (payload) => {
      document.getElementById('mainCard').className = `card ${payload.speakerRole}`;
      document.getElementById('resultCard').style.display = 'flex';
      
      if (payload.speakerRole === 'eavesdrop') {
        document.getElementById('phoneticContainer').style.display = 'none';
        document.getElementById('speakerBadge').innerHTML = `<span class="speaker-tag eavesdrop">🕵️ AI Room Summary</span>`;
        document.getElementById('translatedText').className = `target-text eavesdrop-out`;
        document.getElementById('translatedText').innerText = payload.data.translatedText;
      } else {
        document.getElementById('phoneticContainer').style.display = 'flex';
        document.getElementById('speakerBadge').innerHTML = `<span class="speaker-tag ${payload.speakerRole.replace('speaker-', '')}">${payload.speakerLabel}</span>`;
        document.getElementById('translatedText').className = `target-text ${payload.speakerRole === 'speaker-th1' ? 'en-out' : payload.speakerRole === 'speaker-th2' ? 'en-out2' : 'th-out'}`;
        document.getElementById('translatedText').innerText = payload.data.translatedText;
        document.getElementById('enSoundsLike').innerText = payload.data.enSoundsLike;
        document.getElementById('thSoundsLike').innerText = payload.data.thSoundsLike;
        document.getElementById('toneTip').innerText = payload.data.toneTip;
        speakVoiceActor(payload.data.translatedText, payload.targetLangCode, payload.speakerRole);
      }
    });
  }

  function updateSyncStatus(connected, text) {
    document.getElementById('syncDot').className = 'status-dot ' + (connected ? 'active' : '');
    document.getElementById('syncText').innerText = text;
  }

  // ==========================================
  // MODULE 3: AMBIENT EAVESDROP (RAW AUDIO)
  // ==========================================
  async function toggleEavesdrop() {
    const btn = document.getElementById('eavesdropBtn');
    const label = document.getElementById('eavesdropLabel');
    const mainCard = document.getElementById('mainCard');

    if (!isEavesdropping) {
      // START RECORDING
      try {
        if (recognition && isHardwareRunning) recognition.stop();
        if (isAutoListenEngaged) toggleContinuousListen();

        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
        audioChunks = [];

        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
        mediaRecorder.onstop = processEavesdropAudio;

        mediaRecorder.start();
        isEavesdropping = true;
        
        btn.classList.add('active-pink');
        label.innerText = "🧠 Analyze";
        mainCard.className = 'card eavesdrop-mode';
        document.getElementById('inputText').value = "";
        document.getElementById('inputText').placeholder = "🕵️ Listening to room (Raw Audio)... Tap Analyze when ready.";
        
      } catch (err) {
        alert("Microphone permission required for Eavesdrop mode.");
      }
    } else {
      // STOP & ANALYZE
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
        mediaRecorder.stream.getTracks().forEach(t => t.stop());
      }
      isEavesdropping = false;
      btn.classList.remove('active-pink');
      label.innerText = "Record Room";
    }
  }

  function processEavesdropAudio() {
    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
    const reader = new FileReader();
    
    document.getElementById('resultCard').style.display = 'flex';
    document.getElementById('speakerBadge').innerHTML = `<span class="speaker-tag eavesdrop">🕵️ AI Room Summary</span>`;
    document.getElementById('phoneticContainer').style.display = 'none';
    const targetEl = document.getElementById('translatedText');
    targetEl.className = `target-text eavesdrop-out`;
    targetEl.innerHTML = `<span class="loading-pulse">Analyzing raw audio & regional dialects...</span>`;

    reader.readAsDataURL(audioBlob);
    reader.onloadend = async () => {
      const base64Audio = reader.result.split(',')[1];
      
      const systemPrompt = `You are a highly capable Thai translation agent. You are listening to raw ambient audio of a conversation. 
      The speakers might be speaking fast, overlapping, or using regional dialects like Isan.
      Your job is to identify the overall context, separate the speakers if possible, and provide a clear, concise English summary of what they are talking about.`;

      // API call using generative language Flash 3.6 for audio/multimodal analysis
      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${geminiKey}`;

      try {
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              role: 'user', 
              parts: [
                { text: systemPrompt },
                { inlineData: { mimeType: "audio/webm", data: base64Audio } }
              ]
            }],
            generationConfig: { temperature: 0.2 }
          })
        });

        const data = await response.json();
        if (data.error) throw new Error(data.error.message);

        const summary = data.candidates[0].content.parts[0].text;
        targetEl.innerText = summary;
        document.getElementById('inputText').placeholder = "Speak, type, or use Eavesdrop mode...";
        
        // Sync Eavesdrop summary to partner phone
        if (conn && conn.open) {
          conn.send({ original: "Raw Audio Captured", data: { translatedText: summary }, speakerRole: 'eavesdrop', speakerLabel: 'Room Summary', targetLangCode: 'en-US' });
        }

      } catch (err) {
        targetEl.innerText = `Error analyzing audio: ${err.message}`;
      }
    };
  }

  // ==========================================
  // MODULE 4: STANDARD FAST TRANSLATION
  // ==========================================
  function initSpeechEngine() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) return null;
    const rec = new SpeechRecognition();
    rec.continuous = true;
    rec.interimResults = false;

    rec.onstart = () => {
      isHardwareRunning = true;
      if (!isAutoListenEngaged) {
        document.getElementById('speakBtn').classList.add('active-blue');
      }
    };

    rec.onresult = (event) => {
      const results = event.results;
      const lastTranscript = results[results.length - 1][0].transcript.trim();
      if (lastTranscript && lastTranscript.length > 1) {
        document.getElementById('inputText').value = lastTranscript;
        executeStandardTranslation(lastTranscript);
      }
    };

    rec.onend = () => {
      isHardwareRunning = false;
      document.getElementById('speakBtn').classList.remove('active-blue');
      if (isAutoListenEngaged && !isEavesdropping) {
        setTimeout(() => { if (!isHardwareRunning) try { rec.start(); } catch(e){} }, 150);
      }
    };
    return rec;
  }

  function toggleContinuousListen() {
    if (isEavesdropping) return; 
    isAutoListenEngaged = !isAutoListenEngaged;
    const btn = document.getElementById('listenToggleBtn');

    if (isAutoListenEngaged) {
      btn.classList.add('active-green');
      if (!recognition) recognition = initSpeechEngine();
      recognition.lang = langMode === 'en-to-th' ? 'en-US' : 'th-TH';
      if (!isHardwareRunning) { try { recognition.start(); } catch(e){} }
    } else {
      btn.classList.remove('active-green');
      if (recognition && isHardwareRunning) recognition.stop();
    }
  }

  function triggerManualSpeak() {
    if (isAutoListenEngaged || isEavesdropping) return; 
    if (!recognition) recognition = initSpeechEngine();
    recognition.lang = langMode === 'en-to-th' ? 'en-US' : 'th-TH';
    if (isHardwareRunning) recognition.stop();
    else try { recognition.start(); } catch(e){}
  }

  function handleEnter(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      executeStandardTranslation(e.target.value);
    }
  }

  async function executeStandardTranslation(cleanText) {
    if (!geminiKey) { alert('API Key Required.'); return; }
    const now = Date.now();
    const timeDelta = now - lastSpeechTimestamp;
    lastSpeechTimestamp = now;

    const hasThaiScript = /[\u0E00-\u0E7F]/.test(cleanText);
    let speakerRole = 'speaker-en', speakerLabel = '🧔 English Speaker', direction = 'English to Spoken Thai', targetLang = 'th-TH';

    if (langMode === 'th-to-en' || (langMode === 'auto' && hasThaiScript)) {
      if (timeDelta > 2000) lastThaiSpeaker = (lastThaiSpeaker === 'speaker-th1') ? 'speaker-th2' : 'speaker-th1';
      speakerRole = lastThaiSpeaker;
      speakerLabel = (speakerRole === 'speaker-th1') ? '👩 Thai Speaker 1' : '👱 Thai Speaker 2';
      direction = 'Thai to Conversational English';
      targetLang = 'en-US';
    }

    document.getElementById('mainCard').className = `card ${speakerRole}`;
    document.getElementById('resultCard').style.display = 'flex';
    document.getElementById('phoneticContainer').style.display = 'flex';
    document.getElementById('speakerBadge').innerHTML = `<span class="speaker-tag ${speakerRole.replace('speaker-', '')}">${speakerLabel}</span>`;
    
    const targetEl = document.getElementById('translatedText');
    targetEl.className = `target-text ${speakerRole === 'speaker-th1' ? 'en-out' : speakerRole === 'speaker-th2' ? 'en-out2' : 'th-out'}`;
    
    const cacheKey = cleanText.toLowerCase();
    if (RAM_CACHE.has(cacheKey)) {
      renderStandardResult(RAM_CACHE.get(cacheKey));
      return;
    }

    targetEl.innerHTML = `<span class="loading-pulse">Translating...</span>`;
    
    const sysPrompt = `Translate direction: ${direction}. Use authentic spoken Thai slang and particles. Output JSON: {"translatedText":"","enSoundsLike":"","thSoundsLike":"","toneTip":""}`;

    try {
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${geminiKey}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ role: 'user', parts: [{ text: cleanText }] }],
          systemInstruction: { parts: [{ text: sysPrompt }] },
          generationConfig: { responseMimeType: "application/json", temperature: 0.15 }
        })
      });

      const data = await res.json();
      if(data.error) throw new Error(data.error.message);
      
      let rawText = data.candidates[0].content.parts[0].text.replace(/```json/gi, '').replace(/```/g, '').trim();
      const result = JSON.parse(rawText);
      RAM_CACHE.set(cacheKey, result);
      renderStandardResult(result);
      
      speakVoiceActor(result.translatedText, targetLang, speakerRole);
      
      if (conn && conn.open) {
        conn.send({ original: cleanText, data: result, speakerRole, speakerLabel, targetLangCode: targetLang });
      }

    } catch (err) {
      targetEl.innerText = `Error: ${err.message}`;
    }
  }

  function renderStandardResult(data) {
    document.getElementById('translatedText').innerText = data.translatedText;
    document.getElementById('enSoundsLike').innerText = data.enSoundsLike;
    document.getElementById('thSoundsLike').innerText = data.thSoundsLike;
    document.getElementById('toneTip').innerText = data.toneTip;
  }

  function speakVoiceActor(text, langCode, speakerRole) {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = langCode;
    utterance.rate = 0.95;
    if (speakerRole === 'speaker-th1') utterance.pitch = 1.15;
    else if (speakerRole === 'speaker-th2') utterance.pitch = 0.90;
    else utterance.pitch = 1.0;
    window.speechSynthesis.speak(utterance);
  }
</script>
