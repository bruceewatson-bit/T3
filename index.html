<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Brew Translate (V13)</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  
  <style>
    :root {
      --bg: #0b0f19; --card-bg: #1e293b; --card-sub: #0f172a;
      --accent: #10a37f; --text: #f8fafc; --text-dim: #94a3b8;
      --success: #10b981; --error: #ef4444; --eavesdrop: #ec4899;
      --speaker-en: #0284c7; --speaker-th1: #9333ea; --speaker-th2: #059669;
      --radius: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 12px; display: flex; justify-content: center; min-height: 100vh; }
    .app-container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 10px; padding-bottom: 24px; }
    
    .header { display: flex; justify-content: space-between; align-items: center; }
    .brand { font-size: 1.35rem; font-weight: 800; color: var(--accent); display: flex; align-items: center; gap: 6px; }
    .header-actions { display: flex; gap: 8px; align-items: center; }
    .sync-badge { background: #1e293b; border: 1px solid #334155; padding: 4px 10px; border-radius: 20px; font-size: 0.72rem; display: flex; align-items: center; gap: 6px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #64748b; }
    .status-dot.active { background: var(--success); box-shadow: 0 0 8px var(--success); }
    .btn-icon { background: #1e293b; border: 1px solid #334155; color: var(--text); width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 0.9rem; transition: background 0.2s; }
    .btn-icon.muted { background: #334155; color: #ef4444; }

    .api-key-bar { background: #1e293b; border: 1px dashed #475569; border-radius: 12px; padding: 10px; display: flex; gap: 8px; font-size: 0.8rem; }
    .api-key-bar input { flex: 1; background: transparent; border: none; color: white; outline: none; }
    .api-key-bar button { background: var(--accent); border: none; border-radius: 6px; padding: 4px 8px; font-weight: 600; cursor: pointer; color: white; }

    .lang-mode-bar { display: flex; gap: 6px; background: #0f172a; padding: 3px; border-radius: 12px; border: 1px solid #334155; }
    .btn-lang { flex: 1; padding: 8px 4px; background: transparent; border: none; color: var(--text-dim); font-size: 0.75rem; font-weight: 700; border-radius: 8px; cursor: pointer; transition: all 0.2s; }
    .btn-lang.active { background: var(--accent); color: white; }

    .room-bar { display: flex; gap: 6px; background: var(--card-bg); padding: 8px; border-radius: 12px; align-items: center; border: 1px solid #334155; }
    .room-bar input { flex: 1; background: transparent; border: none; color: white; font-size: 0.85rem; outline: none; text-transform: uppercase; font-weight: 700; }
    .room-bar button { padding: 8px 12px; border: none; border-radius: 8px; font-size: 0.75rem; font-weight: 700; cursor: pointer; transition: all 0.2s; }
    
    .card { background: var(--card-bg); border: 1px solid #334155; border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 10px; transition: border 0.3s; }
    .card.speaker-en { border-color: var(--speaker-en); }
    .card.speaker-th1 { border-color: var(--speaker-th1); }
    .card.speaker-th2 { border-color: var(--speaker-th2); }
    .card.eavesdrop-mode { border-color: var(--eavesdrop); box-shadow: 0 0 15px rgba(236, 72, 153, 0.2); }

    .input-area { width: 100%; min-height: 48px; background: transparent; border: none; color: var(--text); font-size: 1.05rem; resize: none; outline: none; line-height: 1.35; }
    .input-area:disabled { opacity: 0.5; }
    
    .result-section { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid #334155; padding-top: 10px; }
    .speaker-tag { font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; display: flex; align-items: center; gap: 6px; }
    .speaker-tag.en { color: #38bdf8; } .speaker-tag.th1 { color: #c084fc; } .speaker-tag.th2 { color: #34d399; }
    .speaker-tag.eavesdrop { color: var(--eavesdrop); } .speaker-tag.error { color: var(--error); }

    .target-text { font-size: 1.45rem; font-weight: 700; line-height: 1.3; }
    .target-text.en-out { color: #c084fc; } .target-text.en-out2 { color: #34d399; } .target-text.th-out { color: #38bdf8; }
    .target-text.eavesdrop-out { color: #fdf2f8; font-size: 1.15rem; font-weight: 500; }
    
    .phonetic-box { background: var(--card-sub); padding: 8px 10px; border-radius: 8px; border-left: 3px solid var(--accent); }
    .phonetic-label { font-size: 0.65rem; text-transform: uppercase; color: var(--accent); font-weight: 800; }
    .phonetic-text { font-size: 0.95rem; font-weight: 600; color: #e2e8f0; margin-top: 2px; }
    .loading-pulse { animation: pulse 0.8s infinite alternate; color: var(--text-dim); }

    .mic-bar { display: flex; gap: 6px; align-items: stretch; margin-top: 4px; }
    .btn-mic-action { flex: 1; padding: 12px 4px; background: #1e293b; border: 1px solid #334155; border-radius: 12px; color: var(--text-dim); font-size: 0.75rem; font-weight: 800; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; transition: all 0.2s; }
    .btn-mic-action.active-green { background: rgba(16, 185, 129, 0.2); border-color: var(--success); color: var(--success); }
    .btn-mic-action.active-blue { background: var(--speaker-en); color: white; border-color: #0284c7; }
    .btn-mic-action.active-pink { background: var(--error); color: white; border-color: var(--error); animation: pulse 1.5s infinite; }
    .btn-mic-action:disabled { opacity: 0.4; cursor: not-allowed; animation: none; }

    /* Modal Overlay */
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(11,15,25,0.9); backdrop-filter: blur(5px); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
    .modal-content { background: var(--card-bg); border: 1px solid #334155; border-radius: 20px; padding: 24px; width: 100%; max-width: 340px; text-align: center; }
    .qr-box { background: white; padding: 20px; border-radius: 16px; display: inline-block; margin: 10px 0; }

    @keyframes pulse { 0% { opacity: 1; } 100% { opacity: 0.6; } }
  </style>
</head>
<body>

<div class="app-container">
  <div class="header">
    <div class="brand">⚡ Brew Translate <span style="font-size:0.6rem; color:#64748b; font-weight:400;">v13</span></div>
    <div class="header-actions">
      <div class="sync-badge">
        <div id="syncDot" class="status-dot"></div><span id="syncText">Solo</span>
      </div>
      <button id="muteBtn" class="btn-icon" onclick="toggleMute()">🔊</button>
      <button class="btn-icon" onclick="toggleKeySettings()">🔑</button>
    </div>
  </div>

  <div id="apiKeySection" class="api-key-bar" style="display: none;">
    <input type="password" id="openApiKey" placeholder="Paste OpenAI API Key (sk-...) here..." />
    <button onclick="saveApiKey()">Save</button>
  </div>

  <div class="lang-mode-bar">
    <button id="langBtnEn" class="btn-lang active" onclick="setLanguageMode('en-to-th')">⇄ EN ➔ TH</button>
    <button id="langBtnTh" class="btn-lang" onclick="setLanguageMode('th-to-en')">⇄ TH ➔ EN</button>
    <button id="langBtnAuto" class="btn-lang" onclick="setLanguageMode('auto')">✨ Auto Detect</button>
  </div>

  <div class="room-bar">
    <span style="font-size:0.75rem; color:var(--text-dim);">Room:</span>
    <input type="text" id="roomIdInput" value="BREW555" />
    <button style="background: #334155; color: white;" onclick="connectToPartner()">Pair</button>
    <button style="background: var(--accent); color: white;" onclick="showQrModal()">📷 QR</button>
  </div>

  <div id="mainCard" class="card">
    <textarea id="inputText" class="input-area" placeholder="Speak, type, or use Eavesdrop mode..." onkeydown="handleEnter(event)"></textarea>
    
    <div id="resultCard" class="result-section" style="display: none;">
      <div id="speakerBadge" class="speaker-tag"></div>
      <div id="translatedText" class="target-text"></div>

      <div id="phoneticContainer" style="display:none; flex-direction:column; gap:8px;">
        <div class="phonetic-box"><div class="phonetic-label">English Speaker Guide</div><div id="enSoundsLike" class="phonetic-text"></div></div>
        <div class="phonetic-box"><div class="phonetic-label">คำอ่านสำหรับคนไทย</div><div id="thSoundsLike" class="phonetic-text" style="color:#a5f3fc;"></div></div>
        <div id="toneTip" style="font-size: 0.75rem; color: #a3e635; font-style: italic;"></div>
      </div>
    </div>
  </div>

  <div class="mic-bar">
    <button id="listenToggleBtn" class="btn-mic-action" onclick="toggleContinuousListen()">
      <span style="font-size:1.1rem;">🎧</span><span>Auto-Listen</span>
    </button>
    <button id="speakBtn" class="btn-mic-action" onclick="triggerManualSpeak()">
      <span style="font-size:1.1rem;">🎙️</span><span>Tap to Speak</span>
    </button>
    <button id="eavesdropBtn" class="btn-mic-action" onclick="toggleEavesdrop()">
      <span style="font-size:1.1rem;">🕵️</span><span id="eavesdropLabel">Record Room</span>
    </button>
  </div>
</div>

<div id="qrModal" class="modal-overlay" style="display:none;" onclick="closeQrModal()">
  <div class="modal-content" onclick="event.stopPropagation()">
    <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
      <span style="font-weight:800; color:var(--accent); font-size:1.1rem;">📱 Instant Join</span>
      <button class="btn-icon" style="background:transparent; border:none;" onclick="closeQrModal()">✕</button>
    </div>
    <div class="qr-box" id="qrcode"></div>
  </div>
</div>

<script>
  window.addEventListener('load', () => {
    const urlParams = new URLSearchParams(window.location.search);
    const roomParam = urlParams.get('room');
    if (roomParam) { document.getElementById('roomIdInput').value = roomParam.toUpperCase(); connectToPartner(); }
  });

  // --- CORE STATE & CACHE ---
  const RAM_CACHE = new Map();
  let langMode = 'en-to-th';
  let isAutoListenEngaged = false, isHardwareRunning = false, isApiFetching = false;
  let recognition = null;
  let openaiKey = localStorage.getItem('BREW_OPENAI_KEY') || '';
  let activeUtterances = []; 
  
  // Mute State
  let isMuted = false;
  
  let mediaRecorder = null, audioChunks = [], isEavesdropping = false;
  let eavesdropTimer = null, eavesdropSeconds = 0;
  
  let peer = null, conn = null;

  if (!openaiKey) document.getElementById('apiKeySection').style.display = 'flex';
  else document.getElementById('openApiKey').value = openaiKey;

  function toggleMute() {
    isMuted = !isMuted;
    const btn = document.getElementById('muteBtn');
    if (isMuted) {
      btn.innerText = '🔇';
      btn.classList.add('muted');
      if (window.speechSynthesis) window.speechSynthesis.cancel();
    } else {
      btn.innerText = '🔊';
      btn.classList.remove('muted');
    }
  }

  function toggleKeySettings() { const el = document.getElementById('apiKeySection'); el.style.display = el.style.display === 'none' ? 'flex' : 'none'; }
  function saveApiKey() { const key = document.getElementById('openApiKey').value.trim(); if(key){ openaiKey=key; localStorage.setItem('BREW_OPENAI_KEY', key); document.getElementById('apiKeySection').style.display = 'none'; alert('OpenAI Key Saved!'); } }
  function setLanguageMode(mode) { langMode = mode; document.querySelectorAll('.btn-lang').forEach(btn => btn.classList.remove('active')); document.getElementById(mode === 'en-to-th' ? 'langBtnEn' : mode === 'th-to-en' ? 'langBtnTh' : 'langBtnAuto').classList.add('active'); }

  // --- WEBRTC ---
  function connectToPartner() {
    const roomId = document.getElementById('roomIdInput').value.trim().toUpperCase();
    if (!roomId) return;
    if (peer) { peer.destroy(); } 
    updateSyncStatus(true, `Linking...`);
    peer = new Peer(roomId + '-host');
    peer.on('open', () => updateSyncStatus(true, `Room: ${roomId}`));
    peer.on('error', () => { peer = new Peer(); conn = peer.connect(roomId + '-host'); setupConnection(); });
    peer.on('connection', (c) => { conn = c; setupConnection(); });
  }

  function setupConnection() {
    updateSyncStatus(true, "Paired!");
    conn.on('data', (payload) => {
      renderStandardResult(payload.data, payload.speakerRole, payload.speakerLabel, payload.original);
      if(payload.speakerRole !== 'eavesdrop' && !isMuted) speakVoiceActor(payload.data.translatedText, payload.targetLangCode);
    });
  }

  function updateSyncStatus(connected, text) { document.getElementById('syncDot').className = 'status-dot ' + (connected ? 'active' : ''); document.getElementById('syncText').innerText = text; }

  function getBestAudioMimeType() {
    const types = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/aac'];
    for (let type of types) { if (MediaRecorder.isTypeSupported(type)) return type; }
    return '';
  }

  // --- EAVESDROP (10 MIN LIMIT) ---
  async function toggleEavesdrop() {
    if (isApiFetching) return;
    const btn = document.getElementById('eavesdropBtn');
    const inputArea = document.getElementById('inputText');

    if (!isEavesdropping) {
      try {
        if (recognition && isHardwareRunning) recognition.stop();
        if (isAutoListenEngaged) toggleContinuousListen();

        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const mimeType = getBestAudioMimeType();
        mediaRecorder = new MediaRecorder(stream, mimeType ? { mimeType } : undefined);
        audioChunks = [];

        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
        mediaRecorder.onstop = () => processEavesdropAudio(mimeType);
        mediaRecorder.start();
        
        isEavesdropping = true;
        btn.classList.add('active-pink');
        document.getElementById('eavesdropLabel').innerText = "🧠 Analyze";
        document.getElementById('mainCard').className = 'card eavesdrop-mode';
        
        eavesdropSeconds = 0;
        inputArea.value = "";
        
        eavesdropTimer = setInterval(() => {
          eavesdropSeconds++;
          const mins = Math.floor(eavesdropSeconds / 60);
          const secs = eavesdropSeconds % 60;
          const timeStr = mins > 0 ? `${mins}m ${secs}s` : `${secs}s`;
          inputArea.placeholder = `🕵️ Recording Room... (${timeStr}). Tap Analyze.`;
          
          if (eavesdropSeconds >= 600) toggleEavesdrop();
        }, 1000);
      } catch (err) { alert("Microphone permission required."); }
    } else {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
        mediaRecorder.stream.getTracks().forEach(t => t.stop());
      }
      isEavesdropping = false;
      clearInterval(eavesdropTimer);
      btn.classList.remove('active-pink');
      document.getElementById('eavesdropLabel').innerText = "Record Room";
    }
  }

  async function processEavesdropAudio(mimeType) {
    if (!openaiKey) { alert("OpenAI API Key required."); return; }
    if (audioChunks.length === 0) return;
    
    isApiFetching = true; 
    document.getElementById('eavesdropBtn').disabled = true;
    
    const audioBlob = new Blob(audioChunks, { type: mimeType || 'audio/webm' });
    const extension = (mimeType && mimeType.includes('mp4')) ? 'm4a' : 'webm';
    
    document.getElementById('resultCard').style.display = 'flex';
    document.getElementById('phoneticContainer').style.display = 'none';
    document.getElementById('speakerBadge').innerHTML = `<span class="speaker-tag eavesdrop">🕵️ AI Room Summary</span>`;
    const targetEl = document.getElementById('translatedText');
    targetEl.className = 'target-text eavesdrop-out';
    targetEl.innerHTML = `<span class="loading-pulse">Extracting audio with Whisper...</span>`;

    try {
      const formData = new FormData();
      formData.append('file', audioBlob, `audio.${extension}`);
      formData.append('model', 'whisper-1');

      const whisperRes = await fetch('https://api.openai.com/v1/audio/transcriptions', { method: 'POST', headers: { 'Authorization': `Bearer ${openaiKey}` }, body: formData });
      const whisperData = await whisperRes.json();
      if (whisperData.error) throw new Error(whisperData.error.message);
      
      const transcript = whisperData.text;
      if (!transcript || transcript.trim().length === 0) throw new Error("No speech detected in recording.");
      
      targetEl.innerHTML = `<span class="loading-pulse">Summarizing conversation...</span>`;

      const gptRes = await fetch('https://api.openai.com/v1/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${openaiKey}` },
        body: JSON.stringify({
          model: "gpt-4o-mini",
          messages: [
            { role: "system", content: "Analyze this transcript. It may contain overlapping speakers, Thai, English, or Isan. Provide a clear, concise English summary." },
            { role: "user", content: `Transcript: ${transcript}` }
          ],
          temperature: 0.2
        })
      });

      const gptData = await gptRes.json();
      if (gptData.error) throw new Error(gptData.error.message);
      const summary = gptData.choices[0].message.content;
      targetEl.innerText = summary;
      
      if (conn && conn.open) conn.send({ original: "Raw Audio Captured", data: { translatedText: summary }, speakerRole: 'eavesdrop' });

    } catch (err) {
      targetEl.innerText = err.message;
    } finally {
      isApiFetching = false;
      document.getElementById('eavesdropBtn').disabled = false;
      document.getElementById('inputText').placeholder = "Speak, type, or use Eavesdrop mode...";
    }
  }

  // --- STANDARD TRANSLATION ---
  function initSpeechEngine() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return null;
    const rec = new SR();
    rec.continuous = true;
    rec.onstart = () => { isHardwareRunning = true; if(!isAutoListenEngaged) document.getElementById('speakBtn').classList.add('active-blue'); };
    rec.onresult = (e) => {
      const txt = e.results[e.results.length - 1][0].transcript.trim();
      if (txt.length > 1) { document.getElementById('inputText').value = txt; executeStandardTranslation(txt); }
    };
    rec.onend = () => {
      isHardwareRunning = false; document.getElementById('speakBtn').classList.remove('active-blue');
      const isSpeaking = !isMuted && window.speechSynthesis && window.speechSynthesis.speaking;
      if (isAutoListenEngaged && !isEavesdropping && !isSpeaking) {
        setTimeout(() => { if (!isHardwareRunning) try { rec.start(); } catch(e){} }, 100);
      }
    };
    return rec;
  }

  function toggleContinuousListen() {
    if (isEavesdropping) return;
    isAutoListenEngaged = !isAutoListenEngaged;
    document.getElementById('listenToggleBtn').classList.toggle('active-green', isAutoListenEngaged);
    if (!recognition) recognition = initSpeechEngine();
    recognition.lang = langMode === 'en-to-th' ? 'en-US' : 'th-TH';
    if (isAutoListenEngaged && !isHardwareRunning) { try { recognition.start(); } catch(e){} }
    else if (!isAutoListenEngaged && isHardwareRunning) { recognition.stop(); }
  }

  function triggerManualSpeak() {
    if (isAutoListenEngaged || isEavesdropping || isApiFetching) return;
    if (!recognition) recognition = initSpeechEngine();
    recognition.lang = langMode === 'en-to-th' ? 'en-US' : 'th-TH';
    
    // If running, stop it instantly to bypass the 1.5s Android silence delay
    if (isHardwareRunning) {
      recognition.stop();
    } else {
      try { recognition.start(); } catch(e){}
    }
  }

  function handleEnter(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); executeStandardTranslation(e.target.value); } }

  async function executeStandardTranslation(cleanText) {
    if (!openaiKey) { alert('OpenAI API Key Required.'); return; }
    if (isApiFetching) return;

    isApiFetching = true;
    const hasThaiScript = /[\u0E00-\u0E7F]/.test(cleanText);
    const speakerRole = (langMode === 'th-to-en' || (langMode === 'auto' && hasThaiScript)) ? 'speaker-th1' : 'speaker-en';
    const targetLang = speakerRole === 'speaker-en' ? 'th-TH' : 'en-US';

    const cacheKey = cleanText.toLowerCase();
    if (RAM_CACHE.has(cacheKey)) {
      const data = RAM_CACHE.get(cacheKey);
      renderStandardResult(data, speakerRole, speakerRole === 'speaker-en' ? '🧔 English Speaker' : '👩 Thai Speaker');
      if (!isMuted) speakVoiceActor(data.translatedText, targetLang);
      isApiFetching = false;
      return;
    }

    document.getElementById('mainCard').className = `card ${speakerRole}`;
    document.getElementById('resultCard').style.display = 'flex';
    document.getElementById('phoneticContainer').style.display = 'none';
    document.getElementById('translatedText').innerHTML = `<span class="loading-pulse">Translating...</span>`;

    try {
      const res = await fetch('https://api.openai.com/v1/chat/completions', {
        method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${openaiKey}` },
        body: JSON.stringify({
          model: "gpt-4o-mini",
          response_format: { type: "json_object" },
          messages: [
            { role: "system", content: `Translate direction: ${targetLang}. Use spoken Thai slang. Output valid JSON: {"translatedText":"str","enSoundsLike":"str","thSoundsLike":"str","toneTip":"str"}` },
            { role: "user", content: cleanText }
          ],
          temperature: 0.15
        })
      });

      const data = await res.json();
      if (data.error) throw new Error(data.error.message);
      
      let rawText = data.choices[0].message.content.replace(/```json/gi, '').replace(/```/g, '').trim();
      const result = JSON.parse(rawText);
      
      RAM_CACHE.set(cacheKey, result);
      renderStandardResult(result, speakerRole, speakerRole === 'speaker-en' ? '🧔 English Speaker' : '👩 Thai Speaker');
      
      if (!isMuted) speakVoiceActor(result.translatedText, targetLang);
      
      if (conn && conn.open) conn.send({ original: cleanText, data: result, speakerRole, speakerLabel: speakerRole === 'speaker-en' ? '🧔 English Speaker' : '👩 Thai Speaker', targetLangCode: targetLang });
    } catch (err) {
      document.getElementById('translatedText').innerText = "Network Error.";
    } finally {
      isApiFetching = false;
    }
  }

  function renderStandardResult(data, role, label) {
    document.getElementById('mainCard').className = `card ${role}`;
    document.getElementById('speakerBadge').innerHTML = `<span class="speaker-tag ${role.replace('speaker-','')}">${label}</span>`;
    document.getElementById('phoneticContainer').style.display = 'flex';
    document.getElementById('translatedText').className = `target-text ${role === 'speaker-th1' ? 'en-out' : 'th-out'}`;
    document.getElementById('translatedText').innerText = data.translatedText;
    document.getElementById('enSoundsLike').innerText = data.enSoundsLike;
    document.getElementById('thSoundsLike').innerText = data.thSoundsLike;
    document.getElementById('toneTip').innerText = data.toneTip;
  }

  // --- V13: AGGRESSIVE MIC RESTART (SMART TIMER) ---
  function speakVoiceActor(text, langCode) {
    if (isMuted || !window.speechSynthesis) return; 
    
    window.speechSynthesis.cancel(); 
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = langCode; utterance.rate = 0.95;
    
    // Calculate how long this sentence actually takes to say (avg 85ms per character + small buffer)
    const estimatedSpeechDuration = (text.length * 85) + 400; 

    utterance.onstart = () => { 
      if (recognition && isHardwareRunning) recognition.stop(); 
      
      // V13 AGGRESSIVE RESTART: Ignore Android's lazy "onend" and force the mic back on 
      // the exact millisecond the calculated speech time is over.
      setTimeout(() => {
        if (isAutoListenEngaged && !isEavesdropping) {
          if (!isHardwareRunning) { try { recognition.start(); } catch(e){} }
        }
      }, estimatedSpeechDuration);
    };
    
    // Keep this as a backup safety net
    utterance.onend = () => {
      if (isAutoListenEngaged && !isEavesdropping) {
        setTimeout(() => { if (!isHardwareRunning) try { recognition.start(); } catch(e){} }, 100);
      }
    };

    activeUtterances.push(utterance); 
    window.speechSynthesis.speak(utterance);
  }

  let qrInstance = null;
  function showQrModal() {
    const roomId = document.getElementById('roomIdInput').value.trim().toUpperCase() || 'BREW555';
    document.getElementById('roomIdInput').value = roomId;
    const url = `${window.location.origin}${window.location.pathname}?room=${encodeURIComponent(roomId)}`;
    document.getElementById('qrcode').innerHTML = '';
    qrInstance = new QRCode(document.getElementById('qrcode'), { text: url, width: 220, height: 220, colorDark: "#0b0f19", colorLight: "#ffffff" });
    document.getElementById('qrModal').style.display = 'flex';
  }
  function closeQrModal() { document.getElementById('qrModal').style.display = 'none'; }
</script>
